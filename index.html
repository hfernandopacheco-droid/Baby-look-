    <meta charset="UTF-8" />
    <script>
      // Fix for environments/iframes where window.fetch has only a getter
      (function() {
        try {
          var origFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || !desc.set) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return origFetch;
              },
              set: function(fn) {
                origFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {
          try {
            var f = window.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() { return f; },
              set: function(val) { f = val; },
              configurable: true,
              enumerable: true
            });
          } catch (err2) {}
        }
      })();
    </script>

    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        var appId = "%VITE_ONESIGNAL_APP_ID%";
        if (!appId || appId.indexOf("%") === 0 || appId === "TU_APP_ID_AQUI") {
          try {
            appId = localStorage.getItem("bubblo_onesignal_app_id") || "TU_APP_ID_AQUI";
          } catch(e) {}
        }
        if (appId && appId !== "TU_APP_ID_AQUI" && appId.indexOf("%") !== 0) {
          try {
            await OneSignal.init({ appId: appId });
          } catch(err) {
            console.warn("OneSignal init:", err);
          }
        }
      });
    </script>
